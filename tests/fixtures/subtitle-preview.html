<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>统一字幕 · 样式与布局验收</title>
<style>
  body { margin: 0; padding: 32px; background: #f5f6f8; color: #26272b; font: 15px system-ui, sans-serif; }
  main { max-width: 1120px; margin: auto; }
  h1 { font-size: 23px; margin: 0 0 8px; }
  p { color: #666a73; line-height: 1.6; }
  .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin: 24px 0; align-items: center; }
  button, select { font: inherit; border: 1px solid #d5d8df; background: white; color: #26272b; border-radius: 8px; padding: 8px 12px; }
  #player { position: relative; border-radius: 22px; overflow: hidden; background: #141719; }
  video { display: block; width: 100%; aspect-ratio: 16/9; object-fit: contain;
    background: radial-gradient(ellipse at 25% 10%, #eef4f7 0%, transparent 65%),
      radial-gradient(ellipse at 80% 85%, #90a4b2 0%, transparent 70%), linear-gradient(135deg,#c1d1df,#eff2f2 55%,#a8bfcc); }
  .scene { position: absolute; top: 24%; left: 9%; pointer-events: none; color: #384a58; }
  .scene small { letter-spacing: .16em; font-size: 12px; }
  .scene h2 { font-size: clamp(24px, 4vw, 46px); font-weight: 500; margin: 14px 0; }
  .scene p { color: #526976; }
  #player:fullscreen { width: 100%; height: 100%; border-radius: 0; }
  #player:fullscreen video { width: 100%; height: 100%; }
  #player.clipped { max-height: 300px; }
  .note { font-size: 13px; }
</style>
<main>
  <h1>统一字幕预览</h1>
  <p>直接运行扩展的字幕模块，无需课程登录或翻译 API。白字、圆角半透明背景，字幕从底部安全区域向上展开。</p>
  <div class="toolbar">
    <label><input id="bilingual" type="checkbox"> 双语</label>
    <label><input id="reverse" type="checkbox"> 原文在上</label>
    <label><input id="long" type="checkbox"> 长句换行</label>
    <label><input id="clip" type="checkbox"> 裁切播放器</label>
    <select id="size"><option value="small">小</option><option selected value="medium">中</option><option value="large">大</option></select>
    <button id="gap">字幕间隙</button><button id="full">播放器全屏</button><button id="hide">隐藏字幕</button>
  </div>
  <div id="player"><video></video><div class="scene"><small>ECHO360 · SUBTITLE PREVIEW</small><h2>Database security &amp; integrity</h2><p>A shared subtitle style across platforms.</p></div></div>
  <p class="note">可缩放窗口或页面并滚动。全屏按钮测试容器全屏；原生视频全屏及画中画需要在真实课程视频中验证。</p>
</main>
<script src="../../extension/constants.js"></script>
<script src="../../extension/vtt.js"></script>
<script src="../../extension/subtitle_timeline.js"></script>
<script src="../../extension/subtitle_layout.js"></script>
<script src="../../extension/subtitle_overlay.js"></script>
<script>
  const ns = window.Echo360Translator;
  ns.browserApi = { runtime: { getURL: path => new URL('../../extension/' + path, location.href).href } };
  const video = document.querySelector('video');
  let gap = false, hidden = false;
  const vtt = text => `WEBVTT\n\n00:00:00.000 --> 00:00:02.000\n${text}\n`;
  function render() {
    video.currentTime = gap ? 3 : 1;
    ns.subtitleOverlay.mount({ video,
      translatedVtt: vtt(document.getElementById('long').checked ? '字幕会在安全区域内自动换行，即使调整窗口大小、打开侧栏或切换全屏，也能保持统一的圆角半透明背景和清晰的文字。' : '字幕将显示为这样。'),
      originalVtt: vtt('Subtitles appear like this.'),
      bilingual: document.getElementById('bilingual').checked,
      reverseOrder: document.getElementById('reverse').checked,
      size: document.getElementById('size').value });
    ns.subtitleOverlay.setVisible(!hidden);
  }
  document.querySelector('.toolbar').addEventListener('change', () => {
    document.getElementById('player').classList.toggle('clipped', document.getElementById('clip').checked);
    render();
  });
  document.getElementById('gap').onclick = () => { gap = !gap; render(); };
  document.getElementById('hide').onclick = () => { hidden = !hidden; render(); };
  document.getElementById('full').onclick = () => document.getElementById('player').requestFullscreen();
  render();
</script>
</html>
